receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: true

  # デバッグエクスポーター（ログ出力用）
  debug:
    verbosity: detailed
    sampling_initial: 100000  # 最初の100000件を全て記録
    sampling_thereafter: 1    # その後も全て記録

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
      
  extensions: []
  
  telemetry:
    logs:
      level: "debug"